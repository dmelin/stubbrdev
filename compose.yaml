services:
  app:
    build: .
    image: stubbrdev:latest
    restart: unless-stopped
    environment:
      APP_NAME: Stubbr
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY missing in .env}
      APP_URL: ${APP_URL:?APP_URL missing in .env}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-stubbr}
      DB_USERNAME: ${DB_USERNAME:-stubbr}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@stubbr.dev}
      MAIL_FROM_NAME: Stubbr
      EMAIL_HASH_SECRET: ${EMAIL_HASH_SECRET:?EMAIL_HASH_SECRET missing in .env}
    networks:
      - default
      - proxy
      - db
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_NAME}.${BASE_DOMAIN}`)
      - traefik.http.routers.${PROJECT_NAME}.entrypoints=web,websecure
      - traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
  db:
    external: true
