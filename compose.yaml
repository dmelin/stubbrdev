services:
  app:
    build: .
    image: stubbrdev:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Stubbr
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY missing in .env}
      APP_URL: ${APP_URL:?APP_URL missing in .env}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: stubbr
      DB_USERNAME: stubbr
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@stubbr.dev}
      MAIL_FROM_NAME: Stubbr
      EMAIL_HASH_SECRET: ${EMAIL_HASH_SECRET:?EMAIL_HASH_SECRET missing in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PROJECT_NAME}.rule=Host(`${PROJECT_NAME}.${BASE_DOMAIN}`)
      - traefik.http.routers.${PROJECT_NAME}.entrypoints=web,websecure
      - traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=8080

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stubbr
      MYSQL_USER: stubbr
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD missing in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:

networks:
  proxy:
    external: true
